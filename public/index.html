<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAN Voice – Lokales Sprach-Chat</title>
  <meta name="description" content="Lokale LAN VoIP Anwendung für Sprach-Chats im Heimnetzwerk ohne Internet." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== LOBBY ===== -->
  <div id="lobby-screen" class="screen active">
    <div class="bg-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <div class="lobby-container">
      <header class="lobby-header">
        <div class="logo">
          <div class="logo-icon">🎙️</div>
          <div>
            <h1>LAN Voice</h1>
            <p class="subtitle">Lokales Sprach-Chat · Kein Internet nötig</p>
          </div>
        </div>
      </header>

      <div class="lobby-content">
        <!-- Create Room Card -->
        <div class="card glass">
          <div class="card-header">
            <span class="card-icon">➕</span>
            <h2>Raum erstellen</h2>
          </div>
          <div class="form-group">
            <label for="create-username">Dein Name</label>
            <input type="text" id="create-username" placeholder="z.B. Tom" maxlength="30" autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="room-name">Raumname</label>
            <input type="text" id="room-name" placeholder="z.B. Gaming Lounge" maxlength="40" autocomplete="off" />
          </div>
          <button id="create-btn" class="btn btn-primary">
            <span>Raum erstellen</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>

        <!-- Join Room Card -->
        <div class="card glass">
          <div class="card-header">
            <span class="card-icon">🔗</span>
            <h2>Raum beitreten</h2>
          </div>
          <div class="form-group">
            <label for="join-username">Dein Name</label>
            <input type="text" id="join-username" placeholder="z.B. Lisa" maxlength="30" autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="room-id-input">Raum-Code</label>
            <input type="text" id="room-id-input" placeholder="z.B. A1B2C3" maxlength="6"
                   autocomplete="off" style="text-transform:uppercase;letter-spacing:0.15em;" />
          </div>
          <button id="join-btn" class="btn btn-secondary">
            <span>Beitreten</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
          </button>

          <!-- Room List -->
          <div class="room-list-section">
            <div class="room-list-header">
              <span>Offene Räume</span>
              <span class="room-count" id="room-count">0</span>
            </div>
            <div id="room-list" class="room-list">
              <div class="room-list-empty">Keine Räume offen – erstelle einen!</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Audio Device Selector (erscheint nach Mic-Erlaubnis) -->
      <div id="audio-settings-lobby" class="audio-settings-bar glass hidden">
        <div class="audio-settings-inner">
          <span class="audio-settings-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            Audio-Einstellungen
          </span>
          <div class="audio-device-row">
            <div class="form-group">
              <label for="mic-select-lobby">🎤 Mikrofon</label>
              <select id="mic-select-lobby" class="device-select"></select>
            </div>
            <div class="form-group">
              <label for="out-select-lobby">🔊 Ausgabe</label>
              <select id="out-select-lobby" class="device-select"></select>
            </div>
          </div>
        </div>
      </div>

      <div id="lobby-error" class="error-toast hidden"></div>
    </div>
  </div>

  <!-- ===== VOICE ROOM ===== -->
  <div id="room-screen" class="screen">
    <div class="room-layout">

      <!-- Sidebar -->
      <aside class="sidebar glass">
        <div class="sidebar-header">
          <div class="room-info">
            <div class="room-badge">🎙️</div>
            <div>
              <div class="room-name" id="display-room-name">Raum</div>
              <div class="room-code-display">Code: <span id="display-room-code">------</span></div>
            </div>
          </div>
          <button id="copy-code-btn" class="icon-btn" title="Code kopieren">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>

        <div class="participants-section">
          <div class="section-label">Teilnehmer</div>
          <div id="participants-list" class="participants-list"></div>
        </div>

        <div class="sidebar-footer">
          <button id="leave-btn" class="btn btn-danger btn-sm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            Verlassen
          </button>
        </div>
      </aside>

      <!-- Main Area -->
      <main class="room-main">
        <!-- Voice Grid -->
        <section class="voice-section">
          <div id="voice-grid" class="voice-grid"></div>
        </section>

        <!-- Controls -->
        <div class="controls-bar glass">
          <div class="controls-left">
            <div class="volume-container">
              <svg class="volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
              <input type="range" id="volume-slider" min="0" max="200" value="100" class="volume-slider" />
            </div>
          </div>

          <div class="controls-center">
            <button id="mute-btn" class="control-btn mic-btn active" title="Mikrofon stummschalten">
              <svg class="icon-unmuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
              </svg>
              <svg class="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <line x1="1" y1="1" x2="23" y2="23"/>
                <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/>
                <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23M12 19v4M8 23h8"/>
              </svg>
            </button>
          </div>

          <div class="controls-right">
            <button id="settings-toggle-btn" class="icon-btn" title="Audio-Einstellungen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </button>
            <button id="chat-toggle-btn" class="icon-btn" title="Chat ein-/ausblenden">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
              <span class="chat-badge hidden" id="chat-badge">0</span>
            </button>
          </div>
        </div>

        <!-- Settings Panel -->
        <div id="settings-panel" class="settings-panel glass hidden">
          <div class="chat-header">
            <span>🎧 Audio-Einstellungen</span>
            <button id="settings-close-btn" class="icon-btn sm">✕</button>
          </div>
          <div class="settings-body">
            <div class="form-group">
              <label for="mic-select-room">🎤 Mikrofon</label>
              <select id="mic-select-room" class="device-select"></select>
            </div>
            <div class="form-group">
              <label for="out-select-room">🔊 Audio-Ausgabe</label>
              <select id="out-select-room" class="device-select"></select>
              <div class="device-hint">* Nicht in allen Browsern unterstützt</div>
            </div>
            <div id="mic-test-bar" class="mic-test-bar">
              <span class="mic-test-label">Mic-Pegel</span>
              <div class="mic-level-track"><div id="mic-level-fill" class="mic-level-fill"></div></div>
            </div>
          </div>
        </div>

        <!-- Chat Panel -->
        <div id="chat-panel" class="chat-panel glass hidden">
          <div class="chat-header">
            <span>Chat</span>
            <button id="chat-close-btn" class="icon-btn sm">✕</button>
          </div>
          <div id="chat-messages" class="chat-messages"></div>
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Nachricht…" maxlength="500" autocomplete="off" />
            <button id="chat-send-btn" class="btn btn-primary btn-sm">Senden</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Connecting overlay -->
  <div id="connecting-overlay" class="overlay hidden">
    <div class="spinner"></div>
    <p>Verbinde…</p>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
